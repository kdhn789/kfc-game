<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>캐릭터 대전 게임</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            background: #222;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        canvas {
            display: block;
            background: #222;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .ui-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .hp-bar-container {
            width: 300px;
            height: 24px;
            background: #444;
            border: 2px solid #fff;
            position: relative;
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background: #ff3333;
            transition: width 0.1s linear;
        }
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            background: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin: 10px;
            transition: 0.2s;
        }
        button:hover {
            background: #ccc;
        }
        .character-select-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .char-card {
            width: 100px;
            height: 100px;
            background: #444;
            border: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .char-card:hover {
            background: #666;
            border-color: #ffd700;
        }
        #dialogue-box {
            position: absolute;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 초기 메인 메뉴 -->
        <div id="main-menu" class="menu-screen">
            <h1>캐릭터 대전 게임</h1>
            <button onclick="startSinglePlay('normal')">싱글 플레이 시작</button>
            <button onclick="showRoomMenu()">멀티플레이(방 참여)</button>
        </div>

        <!-- 싱글 난이도 선택 메뉴 -->
        <div id="difficulty-menu" class="menu-screen" style="display:none;">
            <h2>난이도 선택</h2>
            <button onclick="selectDifficulty('easy')">쉬움</button>
            <button onclick="selectDifficulty('normal')">보통</button>
            <button onclick="selectDifficulty('hard')">어려움</button>
            <button onclick="selectDifficulty('sandbag')">샌드백 (가만히 있음)</button>
            <button onclick="backToMain()" style="background:#666; color:#fff;">뒤로 가기</button>
        </div>

        <!-- 멀티 방 참여 메뉴 -->
        <div id="room-menu" class="menu-screen" style="display:none;">
            <h2>멀티플레이 방 참여</h2>
            <input type="text" id="room-input" placeholder="방 코드 입력" style="padding:10px; font-size:16px; margin-bottom:10px;">
            <br>
            <button onclick="joinRoom()">입장하기</button>
            <button onclick="backToMain()" style="background:#666; color:#fff;">뒤로 가기</button>
        </div>

        <!-- 캐릭터 선택 화면 -->
        <div id="char-select-screen" class="menu-screen" style="display:none;">
            <h2>캐릭터를 선택하세요</h2>
            <div class="character-select-grid" id="char-grid">
                <!-- 동적 생성 -->
            </div>
        </div>

        <!-- 카운트다운 화면 -->
        <div id="countdown-screen" class="menu-screen" style="display:none;">
            <h1 id="countdown-text" style="font-size: 60px;">3</h1>
        </div>

        <!-- 게임오버 화면 -->
        <div id="game-over-screen" class="menu-screen" style="display:none;">
            <h1 id="game-over-text">게임 종료</h1>
            <button onclick="location.reload()">메인으로 돌아가기</button>
        </div>

        <!-- 게임 화면 캔버스 -->
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- 인게임 상단 UI -->
        <div id="ui-layer" style="display:none;">
            <div class="ui-panel">
                <div>
                    <span id="p1-name" style="font-weight:bold;">플레이어 1</span>
                    <div class="hp-bar-container"><div id="p1-hp" class="hp-bar"></div></div>
                </div>
                <div>
                    <span id="p2-name" style="font-weight:bold; text-align:right; display:block;">플레이어 2</span>
                    <div class="hp-bar-container"><div id="p2-hp" class="hp-bar" style="background:#33cc33;"></div></div>
                </div>
            </div>
        </div>

        <div id="dialogue-box"></div>
    </div>

    <!-- Socket.io 클라이언트 라이브러리 -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let keys = { left: false, right: false, jump: false, skill: false, qSkill: false, rSkill: false };
        let myId = null;

        // 화면 전환 함수들
        function showRoomMenu() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('room-menu').style.display = 'flex';
        }
        function startSinglePlay(diff) {
            socket.emit('start-single-play', diff);
        }
        function selectDifficulty(diff) {
            startSinglePlay(diff);
        }
        function backToMain() {
            document.getElementById('difficulty-menu').style.display = 'none';
            document.getElementById('room-menu').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
        }
        function joinRoom() {
            const roomCode = document.getElementById('room-input').value;
            if (roomCode) {
                socket.emit('join-room', roomCode);
                document.getElementById('room-menu').style.display = 'none';
            }
        }

        socket.on('start-character-select', () => {
            document.querySelectorAll('.menu-screen').forEach(el => el.style.display = 'none');
            document.getElementById('char-select-screen').style.display = 'flex';

            const grid = document.getElementById('char-grid');
            grid.innerHTML = '';
            
            // 캐릭터 목록 (필요에 따라 확장 가능)
            const chars = ['김도현', '성열진']; 
            chars.forEach(charName => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.innerText = charName;
                card.onclick = () => {
                    socket.emit('select-character', charName);
                    document.getElementById('char-select-screen').style.display = 'none';
                };
                grid.appendChild(card);
            });
        });

        socket.on('start-countdown', (players) => {
            document.querySelectorAll('.menu-screen').forEach(el => el.style.display = 'none');
            const countdownScreen = document.getElementById('countdown-screen');
            countdownScreen.style.display = 'flex';
            document.getElementById('ui-layer').style.display = 'flex';

            let count = 3;
            const textEl = document.getElementById('countdown-text');
            textEl.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    textEl.innerText = count;
                } else if (count === 0) {
                    textEl.innerText = '시작!';
                } else {
                    clearInterval(timer);
                    countdownScreen.style.display = 'none';
                }
            }, 1000);
        });

        // 키 입력 리스너
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = true;
            if (e.key === 'f' || e.key === 'F') keys.skill = true;
            if (e.key === 'q' || e.key === 'Q') keys.qSkill = true;
            if (e.key === 'Shift') keys.rSkill = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = false;
            if (e.key === 'f' || e.key === 'F') keys.skill = false;
            if (e.key === 'q' || e.key === 'Q') keys.qSkill = false;
            if (e.key === 'Shift') keys.rSkill = false;
        });

        // 주기적으로 서버에 입력 전송
        setInterval(() => {
            if (socket.connected) {
                socket.emit('player-input', keys);
            }
        }, 1000 / 60);

        // 게임 루프 업데이트 처리
        socket.on('game-update', (state) => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            if (state.screenShake > 0) {
                const shakeX = (Math.random() - 0.5) * state.screenShake;
                const shakeY = (Math.random() - 0.5) * state.screenShake;
                ctx.translate(shakeX, shakeY);
            }

            // 바닥 그리기
            ctx.fillStyle = '#444';
            ctx.fillRect(0, 340, 800, 60);

            // 플레이어들 그리기
            for (let id in state.players) {
                const p = state.players[id];
                
                // 본인 ID 저장
                if (!myId && id === socket.id) myId = id;

                ctx.fillStyle = (id === socket.id) ? '#3498db' : '#e74c3c';
                ctx.fillRect(p.x, p.y, p.width, p.height);

                // 공격 이펙트 표시
                if (p.isAttacking) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    const attX = p.facing === 'right' ? p.x + p.width : p.x - 40;
                    ctx.fillRect(attX, p.y, 40, p.height);
                }

                // HP바 업데이트
                if (id === socket.id) {
                    document.getElementById('p1-hp').style.width = Math.max(0, (p.hp / p.maxHp) * 100) + '%';
                    document.getElementById('p1-name').innerText = (p.char || '미선택') + ' (나)';
                } else {
                    document.getElementById('p2-hp').style.width = Math.max(0, (p.hp / p.maxHp) * 100) + '%';
                    document.getElementById('p2-name').innerText = (p.char || '미선택') + ' (상대)';
                }

                // 대화 말풍선 처리
                if (p.dialogue && p.dialogue !== '') {
                    const dBox = document.getElementById('dialogue-box');
                    dBox.innerText = p.dialogue;
                    dBox.style.display = 'block';
                    dBox.style.left = (p.x + p.width / 2 - 30) + 'px';
                    dBox.style.top = (p.y - 30) + 'px';
                }
            }

            // 투사체 렌더링 (원기둥 창 및 페이드 아웃 효과 적용)[cite: 4]
            if (state.projectiles) {
                state.projectiles.forEach(proj => {
                    ctx.save();
                    if (proj.life !== undefined && proj.maxLife) {
                        ctx.globalAlpha = proj.life / proj.maxLife;
                    }

                    ctx.fillStyle = proj.color || '#00bcd4';

                    if (proj.isSpear) {
                        // 원기둥 형태의 굵고 긴 창 렌더링
                        ctx.beginPath();
                        const radius = proj.height / 2;
                        ctx.roundRect(proj.x, proj.y, proj.width, proj.height, radius);
                        ctx.fill();
                        
                        // 창 앞부분 디테일
                        ctx.fillStyle = '#fff';
                        if (proj.vx > 0) {
                            ctx.fillRect(proj.x + proj.width - 10, proj.y + 2, 10, proj.height - 4);
                        } else {
                            ctx.fillRect(proj.x, proj.y + 2, 10, proj.height - 4);
                        }
                    } else {
                        // 일반 투사체
                        ctx.beginPath();
                        ctx.arc(proj.x, proj.y, proj.life !== undefined ? 3 : 6, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                });
            }

            ctx.restore();
        });

        socket.on('game-over', (data) => {
            document.getElementById('ui-layer').style.display = 'none';
            const overScreen = document.getElementById('game-over-screen');
            overScreen.style.display = 'flex';
            
            const text = document.getElementById('game-over-text');
            if (data.winner === socket.id) {
                text.innerText = '승리하셨습니다!';
            } else if (data.winner === null) {
                text.innerText = '상대방이 나갔습니다.';
            } else {
                text.innerText = '패배했습니다...';
            }
        });
    </script>
</body>
</html>
